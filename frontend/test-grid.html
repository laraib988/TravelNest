<!DOCTYPE html>
<html>
<head>
<style>
  .tour-gallery-desktop {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 12px;
    height: 480px;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 40px;
  }
  .right-side {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 12px;
    height: 100%;
  }
  .item {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
  }
  .item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="tour-gallery-desktop" style="border: 2px solid red;">
    <div class="item">
      <img src="https://via.placeholder.com/1200x1600" />
    </div>
    <div class="right-side">
      <div class="item"><img src="https://via.placeholder.com/600x1200" /></div>
      <div class="item"><img src="https://via.placeholder.com/600x1200" /></div>
      <div class="item"><img src="https://via.placeholder.com/600x1200" /></div>
      <div class="item"><img src="https://via.placeholder.com/600x1200" /></div>
    </div>
  </div>
</body>
</html>
