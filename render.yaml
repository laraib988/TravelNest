# TravelNest API — Render Blueprint
# If using the dashboard instead of this file, set:
#   Root Directory = backend
#   Build Command  = npm install && npm run build
#   Start Command  = npm start
#
# If Root Directory is left blank (repo root), root package.json
# runs `prebuild` → npm install --prefix backend before tsc.

services:
  - type: web
    name: travelnest-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
